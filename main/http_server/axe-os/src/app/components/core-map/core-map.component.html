<div class="card mb-0 core-map">
    <div class="core-map__head">
        <span class="core-map__title">
            <i class="pi pi-th-large"></i>
            Carte des cœurs ASIC
        </span>
        <span class="core-map__meta">
            <span class="core-map__stat core-map__stat--live">128 cœurs en hachage continu</span>
            <span class="core-map__stat" *ngIf="hotCore >= 0">cœur chaud <b>#{{ hotCore }}</b></span>
            <span class="core-map__live">
                <span class="core-map__dot"></span>
                {{ total }} solutions
            </span>
        </span>
    </div>

    <div class="core-map__grid">
        <div class="core-map__cell"
             *ngFor="let c of cells; trackBy: trackIdx"
             [class.core-map__cell--idle]="counts[c] === 0"
             [class.core-map__cell--hot]="c === hotCore"
             [style.background]="bg[c]"
             [style.color]="fg[c]"
             [style.box-shadow]="glow[c]"
             [style.animation-delay]="delays[c]"
             [title]="'Cœur ' + c + ' : ' + counts[c] + ' solutions'">
            {{ counts[c] || '' }}
        </div>
    </div>

    <div class="core-map__legend">
        <span>peu</span>
        <span class="core-map__bar"></span>
        <span>beaucoup de solutions</span>
    </div>
    <div class="core-map__foot">Chaque case respire = le cœur hache en continu · un éclair = une solution trouvée · la teinte = nombre cumulé.</div>
</div>
